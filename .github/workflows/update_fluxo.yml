name: Atualizar Fluxo B3

on:
  schedule:
    # Roda de seg a sex às 08:00 horário de Brasília (11:00 UTC)
    - cron: '0 11 * * 1-5'
  workflow_dispatch:  # permite rodar manualmente pelo GitHub

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Executar script de atualização
        run: python update_fluxo.py

      - name: Commit e push se houve mudanças
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "Sem dados novos. Nenhum commit necessário."
          else
            git commit -m "dados: atualiza fluxo B3 $(date +'%d/%m/%Y')"
            git push
          fi
